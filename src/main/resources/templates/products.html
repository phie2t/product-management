<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Product Management Dashboard</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container my-4">
    <div class="row">
        <!-- Form Section -->
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-secondary text-white">
                    <span id="formTitle">Add Product</span>
                </div>
                <div class="card-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" step="0.01" id="price" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="saveBtn">Save Product</button>
                        <button type="button" class="btn btn-link w-100 mt-1 d-none" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Table & Search Section -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <input type="text" id="searchName" class="form-control" placeholder="Search by name">
                        </div>
                        <div class="col-md-3">
                            <input type="number" id="minPrice" class="form-control" placeholder="Min Price">
                        </div>
                        <div class="col-md-3">
                            <input type="number" id="maxPrice" class="form-control" placeholder="Max Price">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary w-100" onclick="searchProducts()">Search</button>
                        </div>
                    </div>

                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="productTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('jwtToken');
    if (!token) window.location.href = '/login';

    const authHeaders = {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
    };

    async function loadProducts() {
        const res = await fetch('/api/products', { headers: authHeaders });
        if (res.status === 401 || res.status === 403) logout();
        const data = await res.json();
        renderTable(data);
    }

    async function searchProducts() {
        const name = document.getElementById('searchName').value;
        const minPrice = document.getElementById('minPrice').value;
        const maxPrice = document.getElementById('maxPrice').value;

        const params = new URLSearchParams();
        if (name) params.append('name', name);
        if (minPrice) params.append('minPrice', minPrice);
        if (maxPrice) params.append('maxPrice', maxPrice);

        const res = await fetch('/api/products/search?' + params.toString(), { headers: authHeaders });
        const data = await res.json();
        renderTable(data);
    }

    function renderTable(products) {
        const tbody = document.getElementById('productTableBody');
        tbody.innerHTML = '';
        products.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.description || '-'}</td>
                    <td>$${p.price.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editProduct(${p.id}, '${p.name}', '${p.description || ''}', ${p.price})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('productId').value;
        const name = document.getElementById('name').value;
        const description = document.getElementById('description').value;
        const price = parseFloat(document.getElementById('price').value);

        const payload = JSON.stringify({ name, description, price });
        const url = id ? `/api/products/${id}` : '/api/products';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, { method, headers: authHeaders, body: payload });
        if (res.ok) {
            resetForm();
            loadProducts();
        } else {
            alert('Failed to save product');
        }
    });

    function editProduct(id, name, description, price) {
        document.getElementById('productId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('description').value = description;
        document.getElementById('price').value = price;
        document.getElementById('formTitle').innerText = 'Edit Product';
        document.getElementById('cancelBtn').classList.remove('d-none');
    }

    function resetForm() {
        document.getElementById('productId').value = '';
        document.getElementById('name').value = '';
        document.getElementById('description').value = '';
        document.getElementById('price').value = '';
        document.getElementById('formTitle').innerText = 'Add Product';
        document.getElementById('cancelBtn').classList.add('d-none');
    }

    async function deleteProduct(id) {
        if (confirm('Are you sure you want to delete this product?')) {
            await fetch(`/api/products/${id}`, { method: 'DELETE', headers: authHeaders });
            loadProducts();
        }
    }

    function logout() {
        localStorage.removeItem('jwtToken');
        window.location.href = '/login';
    }

    loadProducts();
</script>
</body>
</html>
